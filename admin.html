<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanamarenko - Beheer</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07111d;
            --panel: rgba(13, 24, 40, 0.88);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f3f7fb;
            --muted: #a9b8cb;
            --accent: #8fe56c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, rgba(69, 127, 255, 0.28), transparent 35%),
                linear-gradient(180deg, #08121f, var(--bg));
            color: var(--text);
            font: 16px/1.65 "Segoe UI", Tahoma, sans-serif;
        }

        .card {
            width: min(560px, 100%);
            padding: 28px;
            border-radius: 28px;
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.8rem);
            line-height: 1.05;
        }

        p {
            margin: 0 0 16px;
            color: var(--muted);
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), #66d7cf);
            color: #051018;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Beheer verloopt via de StanAdmin-app</h1>
        <p>De publieke website bevat geen webbeheer meer. Projecten, updates, biografie en onderhoudsstatus worden beheerd via de aparte StanAdmin-app.</p>
        <p>Zo blijven er geen beheercodes of inlogvelden zichtbaar op GitHub Pages.</p>
        <a href="./index.html">Terug naar de website</a>
    </main>
</body>
</html>
